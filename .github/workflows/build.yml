name: build-termux-eg

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-termux-eg
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build harness (overlay + patch)
        uses: actions/checkout@v4

      - name: Checkout upstream termux-app v0.118.0
        uses: actions/checkout@v4
        with:
          repository: termux/termux-app
          ref: v0.118.0
          path: src

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Android SDK packages + NDK
        run: |
          set -x
          SDKMGR="$(command -v sdkmanager || true)"
          [ -z "$SDKMGR" ] && SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ ! -x "$SDKMGR" ] && SDKMGR="$ANDROID_HOME/tools/bin/sdkmanager"
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMGR" --install "platforms;android-30" "build-tools;30.0.2" "ndk;22.1.7171670" > /dev/null 2>&1 || true
          ls -d "$ANDROID_HOME/ndk/"* || true

      - name: Apply eg overlay + patch
        run: |
          cp -rv overlay/app/. src/app/
          python3 patch.py src
          test -f src/app/src/main/java/com/termux/app/EditorActivity.java
          test -f src/app/src/main/java/com/termux/app/EgWatcher.java
          test -f src/app/src/main/res/layout/activity_editor.xml

      - name: Build (debug, arm64-v8a)
        run: |
          cd src
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          ls -la src/app/build/outputs/apk/debug/
          mkdir -p out
          cp src/app/build/outputs/apk/debug/termux-app_debug_arm64-v8a.apk out/termux-eg-arm64-v8a.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: termux-eg-apk
          path: out/termux-eg-arm64-v8a.apk
          if-no-files-found: error
